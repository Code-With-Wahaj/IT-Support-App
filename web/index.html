<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aptech Network Hub IT Support Application">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Aptech Network Hub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Preload splash logo so it decodes with zero delay -->
  <link rel="preload" href="logo.png" as="image">
  <link rel="preload" href="assets/assets/logo.png" as="image">

  <meta name="theme-color" content="#0F172A">
  <meta name="color-scheme" content="dark">

  <title>Aptech Network Hub</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body, flutter-view, flt-glass-pane {
      margin: 0;
      padding: 0;
      background-color: #0F172A !important;
      color-scheme: dark;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0F172A !important;
    }
    #splash-root {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      text-align: center;
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .splash-card {
      width: 136px;
      height: 136px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      border: 1.2px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .splash-logo {
      width: 104px;
      height: 104px;
      object-fit: contain;
      border-radius: 14px;
    }
    .splash-title {
      margin-top: 24px;
      font-size: 24px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.6px;
    }
    .splash-slogan {
      margin-top: 8px;
      font-size: 13.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.68);
      letter-spacing: 0.3px;
    }
    .splash-spinner {
      margin-top: 32px;
      width: 24px;
      height: 24px;
      border: 2.4px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38BDF8;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="splash-root">
    <div class="splash-card">
      <img src="logo.png" alt="Aptech Network Hub Logo" class="splash-logo" onerror="this.src='icons/Icon-192.png'" />
    </div>
    <div class="splash-title">Aptech Network Hub</div>
    <div class="splash-slogan">Smart IT Infrastructure & Lab Management</div>
    <div class="splash-spinner"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
